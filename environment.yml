# Cleaned, submission-oriented environment reconstructed from the original export.
# Target platform: Linux x86_64
# Python: 3.10.21
# PyTorch: 2.1.2 + CUDA 11.8 wheel
# Note: NVIDIA driver / host OS / GPU requirements must still be documented in README.
#
# Design choices:
# - removed server-specific prefix
# - removed Conda build strings
# - removed most low-level OS/GUI/compiler/runtime libraries that Conda can resolve
# - kept application-level Python packages pinned to the versions in the original export
# - kept libopenblas pinned because the original environment used OpenBLAS
# - pinned the exact Linux CPython 3.10 CUDA 11.8 PyTorch wheel

name: sicbi

channels:
  - conda-forge
  - nodefaults

dependencies:
  # Core interpreter / package manager
  - python=3.10.21
  - pip=26.2.1
  - setuptools=84.0.0
  - wheel=0.48.0

  # Numerical / scientific stack
  - numpy=1.26.4
  - pandas=2.3.3
  - matplotlib=3.9.4
  - rdkit=2026.03.6
  - libopenblas=0.3.34

  # Project-level Python packages preserved from the original Conda environment
  - backports.zstd=1.7.0
  - brotli-python=1.2.0
  - certifi=2026.7.22
  - charset-normalizer=3.5.1
  - contourpy=1.3.1
  - cycler=0.12.1
  - fonttools=4.63.0
  - freetype-py=2.3.0
  - fsspec=2026.7.0
  - greenlet=3.5.5
  - h2=4.4.1
  - hpack=4.2.0
  - huggingface_hub=0.25.1
  - hyperframe=6.1.0
  - idna=3.19
  - kiwisolver=1.5.1
  - munkres=1.1.4
  - packaging=26.3
  - pillow=12.3.0
  - pycairo=1.29.1
  - pyparsing=3.3.2
  - pyside6=6.11.2
  - pysocks=1.7.1
  - python-dateutil=2.9.0.post0
  - python-tzdata=2026.3
  - pytz=2026.3.post1
  - pyyaml=6.0.3
  - reportlab=5.0.1
  - requests=2.34.2
  - rlpycairo=0.4.0
  - six=1.17.0
  - sqlalchemy=2.0.52
  - tokenizers=0.23.1
  - tornado=6.5.8
  - tqdm=4.70.0
  - typing_extensions=4.16.0
  - tzdata=2026c
  - unicodedata2=17.0.1
  - urllib3=2.7.0

  # Pip packages preserved exactly from the original export.
  # The exact PyTorch CUDA 11.8 wheel is used instead of relying on a server-specific pip index.
  - pip:
      - aiohappyeyeballs==2.7.1
      - aiohttp==3.14.3
      - aiosignal==1.4.0
      - async-timeout==5.0.1
      - attrs==26.1.0
      - filelock==3.32.3
      - frozenlist==1.8.0
      - jinja2==3.1.6
      - markupsafe==3.0.3
      - mpmath==1.3.0
      - multidict==6.7.1
      - networkx==3.4.2
      - propcache==0.5.2
      - psutil==7.2.2
      - sympy==1.14.0
      - "torch @ https://download.pytorch.org/whl/cu118/torch-2.1.2%2Bcu118-cp310-cp310-linux_x86_64.whl"
      - torch-geometric==2.7.0
      - triton==2.1.0
      - xxhash==4.0.1
      - yarl==1.24.5
